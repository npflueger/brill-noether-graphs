status:
  scope: >-
    Four compared declarations express three result families for connected
    finite loopless multigraphs: Brill--Noether existence through genus six;
    the rank bound w^r_d >= min(rho, d - r) through genus six for r >= 0 and
    rho >= 0, together with its corollary w^r_d >= rho when d <= g + r; and
    once-marked existence through genus five. The additional rank cases are
    arbitrary pairs in genus five (w^1_4 >= 1) and arbitrary triples in genus
    six (w^1_5 >= 2), with repetitions allowed. Existence through genus five
    is the Atanasov--Ranganathan theorem. Universal existence or the rank
    bound in genus seven and higher, and once-marked existence in genus six
    and higher, are not addressed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: "GenusSix.brill_noether_existence_through_six"
      file: "Palomar/Solutions/GenusSix.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "Palomar/GenusSix/comparator.json"
      literature_dependencies: []
    - declaration: "GenusSix.brill_noether_rank_through_six"
      file: "Palomar/Solutions/GenusSix.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "Palomar/GenusSix/comparator.json"
      literature_dependencies: []
    - declaration: "GenusSix.brill_noether_rank_ge_rho_through_six"
      file: "Palomar/Solutions/GenusSix.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "Palomar/GenusSix/comparator.json"
