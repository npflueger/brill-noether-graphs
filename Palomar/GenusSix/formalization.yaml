# Palomar reads the narrative account only from the Challenge's module
# documentation, the docstrings of the compared declarations, the README of the
# selected project (here the repository root), and this file
# (CONTRIBUTING.md, section 3.4).  Palomar/GenusSix/README.md is not among them,
# so its formulation choices are restated here.
fidelity:
  divergences: >-
    All statements concern finite graphs, not metric graphs.  A graph is a
    finite, nonempty multigraph without loops, with its edges stored as a
    multiset of vertex pairs; connectivity means that every nontrivial vertex
    cut is crossed by an edge, and the genus is the cyclomatic number |E| - |V|
    + 1, an integer. In the Challenge, rank_geq G D k expresses the
    Baker--Norine condition that D - E is equivalent to an effective divisor for
    every effective E of degree k.  Each existence and rank conclusion gives a divisor of degree
    exactly d and rank at least r, whereas Baker's conjecture asks for rank
    exactly r and degree at most d; for nonnegative r the two existence
    formulations are equivalent. The condition rho >= 0 is written as
    (r + 1)(g - d + r) <= g. The existence statement also permits r < 0,
    where its rank condition is vacuous; the rank-bound statements require
    0 <= r.  The once-marked statement uses Mathlib's
    YoungDiagram, is normalized to a witness of degree exactly g, and tests only
    the rows of the diagram (the inequalities for larger row indices follow
    from Riemann--Roch); this is equivalent to containment of the Weierstrass
    partition of Pflueger--Solomon, Definition 1.6. All four statements use
    vertex types in Type, as does the library's Atanasov--Ranganathan theorem;
    the library's genus-six theorem holds in every universe.  The
    Draisma--Vargas and Vargas constructions concern metric graphs and are
    adapted to finite graphs in divisorial form.  The prediction of Christ--Ma
    is proved combinatorially, in genus six only and only for the parity of the
    refinement, rather than through their algebro-geometric argument.

    The Challenge expresses Brill--Noether rank by quantifying over every
    effective vertex divisor E of degree r + k and producing a degree-d
    divisor D of rank at least r with D - E equivalent to an effective
    divisor. Replacing D by a linearly equivalent divisor gives literal
    containment of E, as in Lim--Payne--Potashnik, Definition 1.5. The first
    bound takes k = min(rho, d - r), since containment imposes k <= d - r;
    the second takes k = rho under d <= g + r. All divisors here have
    integral coefficients and vertex support. Metric existence and metric
    Brill--Noether rank theorems do not automatically imply these discrete
    completion statements.

