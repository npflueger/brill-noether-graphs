fidelity:
  divergences: >-
    The original CDPR paper works with metric graphs; the formalized statements
    consider only finite graphs. For metric graphs with positive integer edge
    lengths, passage to a unit-edge subdivision, together with Luo's theory of
    rank-determining sets, relates the relevant divisor-rank calculations.
    This comparison is not established in the repository: metric graphs and
    their divisor theory have not been formally defined here. The submitted
    CDPR statements should therefore be regarded as finite, discrete
    adaptations of the metric results. Chains are defined by joining disjoint
    factors with bridge edges rather than identifying adjacent marked vertices,
    to simplify the definitions in the challenge file. The general chain
    criteria are stated explicitly as Theorem 1.13 and Corollary 6.16 of
    Pflueger--Solomon. The concrete specializations to chains mixing cycles and
    evenly marked theta graphs are not stated verbatim; they combine those
    criteria with Example 1.11 and Theorem 1.12, part (2), equivalently
    Corollary 4.17. The calculation of the gonality of a common-torsion chain,
    and the corollary that graphs of every conjecturally possible gonality
    exist, are derived in this formalization rather than explicitly stated in
    the source papers.

review:
  status: "self-assessed"
  reviewers:
    - "Nathan Pflueger"
  notes: >-
    The definitions were compared against definitions in the three source
    papers. The theorem statements were compared against Theorem 1.1 of CDPR;
    Theorems A and C of Pflueger; and Example 1.11, Theorems 1.12 and 1.13, and
    Corollaries 4.17 and 6.16 of Pflueger--Solomon. The formalized results on
    mixed chains do not correspond verbatim to those statements, but rather
    are corollaries of them; this correspondence was checked directly.

alignment:
  namespace: "BNChains"
  statements:
    - source: "Cools--Draisma--Payne--Robeva (2012), Theorem 1.1(2), finite graph form"
      lean: "BNChains.cdpr_marked_no_high_multiplicity"
      module: "Solutions.BNChains"
      status: "adapted"
      note: >-
        The formalization considers finite, not metric, graphs, and includes
        bridge edges. The proof deduces this from the methods of
        Pflueger--Solomon, rather than formalizing the original proof.
    - source: "Cools--Draisma--Payne--Robeva (2012), Theorem 1.1(1), finite graph form"
      lean: "BNChains.cdpr_chain_brill_noether_general"
      module: "Solutions.BNChains"
      status: "adapted"
      note: >-
        The formalization considers finite, not metric, graphs, and includes
        bridge edges. The proof deduces this from the methods of
        Pflueger--Solomon, rather than formalizing the original proof.
    - source: "Pflueger--Solomon (2025), Example 1.11 combined with Theorem 1.13(2)"
      lean: "BNChains.cycle_chain_brill_noether_general_of_torsion"
      module: "Solutions.BNChains"
      status: "derived"
      note: >-
        The formalized result specializes Theorem 1.13(2) to the cycle factors
        described in Example 1.11.
    - source: >-
        Pflueger--Solomon (2025), Example 1.11 and Theorem 1.12(2), combined
        with Theorem 1.13(1) / Corollary 6.16(1)
      lean: "BNChains.cycle_theta_chain_marked_no_high_multiplicity"
      module: "Solutions.BNChains"
      status: "derived"
      note: >-
        The formalized result specializes the marked-chain criterion to cycles
        and evenly marked theta graphs, then specializes once-marked
        Brill--Noether generality to the endpoint-multiplicity obstruction in
        CDPR, Theorem 1.1(2).
    - source: >-
        Pflueger--Solomon (2025), Example 1.11, Theorem 1.12(2) / Corollary
        4.17, and Theorem 1.13(2) / Corollary 6.16(2)
      lean: "BNChains.cycle_theta_chain_brill_noether_general"
      module: "Solutions.BNChains"
      status: "adapted"
      note: >-
        This directly specializes the general chain criterion. Example 1.11
        supplies general transmission for the cycle factors, while Theorem
        1.12(2), equivalently Corollary 4.17, supplies it for the evenly marked
        theta factors. The readable factor data records the edge lengths and
        exact periods used in the minimum torsion budget.
    - source: >-
        Pflueger (2022), Theorems A and C; Pflueger--Solomon (2025), Example
        1.11 and Corollary 4.17
      lean: "BNChains.cycle_theta_chain_gonality_eq_common_torsion"
      module: "Solutions.BNChains"
      status: "derived"
      note: >-
        Example 1.11 and Corollary 4.17 establish general transmission for the
        individual factors. Pflueger's Theorem A preserves common-period
        general transmission under vertex gluing, and Theorem C supplies the
        degree-k rank-one divisor. The exclusion of lower-degree rank-one
        divisors in the stated range, and transport to the displayed
        bridge-chain model, are carried out in the formalization.
    - source: "Corollary of other results"
      lean: "BNChains.exists_graph_of_genus_and_gonality"
      module: "Solutions.BNChains"
      status: "proved"
      note: >-
        Constructs at least one graph of each desired gonality and genus using
        BNChains.cycle_theta_chain_gonality_eq_common_torsion.

