version: "v0.4"

project:
  name: "Brill--Noether generality and gonality for chains of cycles and theta graphs"
  description: >-
    This repository formalizes Brill--Noether generality for chains whose
    factors may be cycles or theta graphs, subject to a genericity condition on
    path lengths and an evenly-marked condition on the theta factors. A graph
    is called Brill--Noether general if the possible degrees and ranks of its
    chip configurations, in the sense of Baker and Norine, match the behavior
    of a general algebraic curve. Here we use only the existential form of
    Brill--Noether generality, without computing dimensions. Following
    Cools--Draisma--Payne--Robeva, we also formalize a mild vanishing-order
    condition that permits the recovery of dimension statements on the
    algebraic side. A Brill--Noether general graph also has the conjectural
    maximum gonality in its genus. The chain of cycles case is a theorem of
    Cools--Draisma--Payne--Robeva, which Pflueger--Solomon generalized to allow
    evenly-marked theta graphs. Among other things, the construction shows the
    existence, in every positive genus g, of graphs with every gonality between
    2 and ceil(g/2) + 1, inclusive.
  authors:
    - "Nathan Pflueger"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Nathan Pflueger"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C57", "14T15", "14H51"]

sources:
  - title: "A tropical proof of the Brill--Noether theorem"
    authors:
      - "Filip Cools"
      - "Jan Draisma"
      - "Sam Payne"
      - "Elina Robeva"
    id: "https://doi.org/10.1016/j.aim.2012.02.019"
    type: "paper"
    location: "Advances in Mathematics 230 (2012), no. 2, 759--776"
    relationship: "formalizes"
    note: >-
      Source of the chain of loops construction. The first two submitted
      statements are finite-graph adaptations of parts (2) and (1),
      respectively, of Theorem 1.1.
  - title: "(Hurwitz-)Brill--Noether general marked graphs via the Demazure product"
    authors:
      - "Nathan Pflueger"
    id: "https://arxiv.org/abs/2201.12316"
    type: "paper"
    location: "arXiv:2201.12316 (2022; revised 2026)"
    relationship: "formalizes"
    note: >-
      Develops the transmission-permutation machinery used by the later
      Pflueger--Solomon paper. Theorem A proves that common-period general
      transmission is preserved by vertex gluing, and Theorem C supplies the
      associated degree-k rank-one divisor.
  - title: "Twice-marked banana graphs & Brill--Noether generality"
    authors:
      - "Nathan Pflueger"
      - "Noah Solomon"
    id: "https://doi.org/10.5802/alco.443"
    type: "paper"
    location: "Algebraic Combinatorics 8 (2025), no. 5, 1415--1457"
    relationship: "formalizes"
    note: >-
      Proves a general result on Brill--Noether generality of chains of graphs,
      subject to a condition called general transmission, and proves that cycles
      and evenly marked theta graphs have general transmission. These imply the
      Brill--Noether generality of mixed chains of cycles and theta graphs,
      subject to genericity and evenly-marked hypotheses. This paper also
      proves various other results about banana graphs, which are not included
      in this submission.

status:
  scope: >-
    The submission proves seven finite-graph statements. Five concern the
    nonexistence half of Brill--Noether generality for chains. The first two
    are parts (1) and (2) of the original CDPR theorem. The next three are a
    sharp cycle-chain theorem stated in terms of torsion orders, a marked
    mixed-chain theorem with a one-sided torsion budget, and an unmarked
    mixed-chain theorem for explicitly specified cycles and evenly marked
    theta graphs with a minimum torsion budget. The other two results establish
    the gonality of common-torsion chains and state the corollary that all
    gonalities between 2 and ceil(g/2) + 1 inclusive occur on finite graphs.
    The dimension statement CDPR Theorem 1.3 and the enumerative CDPR Theorem
    1.4 are not proved here, nor is Corollary 1.2 concerning algebraic curves
    specializing to a graph. The remaining results of Pflueger--Solomon are
    not included in this submission, although they are all formalized within
    the repository.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
